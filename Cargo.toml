[package]
name = "decompsite"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/Almamu/decompilati.onl"
homepage = "https://decompilati.onl"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jsonwebtoken = "9"
maud = "0.27.0"
parking_lot = "0.12.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "limit", "timeout", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
